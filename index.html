<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>HISPAFLY EFB - Pilot Login</title>
    <style>
        :root {
            --red: #d71920;
            --yellow: #ffc400;
            --ink: #07111f;
            --white: #ffffff;
            --muted: rgba(255,255,255,0.72);
            --panel: rgba(4, 7, 12, 0.74);
            --panel-strong: rgba(2, 4, 8, 0.86);
            --line: rgba(255,255,255,0.18);
            --shadow: 0 24px 80px rgba(0,0,0,0.42);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            background: #05080d;
            color: var(--white);
            font-family: Arial, Helvetica, sans-serif;
            letter-spacing: 0;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            display: none;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            display: none;
        }

        .stage {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 0;
        }

        .device {
            width: 100vw;
            min-height: 100vh;
            background: #05080d;
        }

        .screen {
            position: relative;
            min-height: 100vh;
            overflow: hidden;
            background-image:
                linear-gradient(90deg, rgba(1,3,7,0.88) 0%, rgba(1,3,7,0.70) 38%, rgba(1,3,7,0.16) 39%, rgba(1,3,7,0.04) 100%),
                url("assets/login-tablet-bg.jpg");
            background-size: cover;
            background-position: center;
        }

        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: rgba(0,0,0,0.56);
            color: rgba(255,255,255,0.78);
            border-bottom: 1px solid rgba(255,255,255,0.10);
            font-size: 11px;
        }

        .status-right {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .signal {
            display: inline-flex;
            align-items: end;
            gap: 2px;
            height: 12px;
        }

        .signal span {
            width: 3px;
            border-radius: 2px;
            background: rgba(255,255,255,0.82);
        }

        .signal span:nth-child(1) {
            height: 4px;
        }

        .signal span:nth-child(2) {
            height: 7px;
        }

        .signal span:nth-child(3) {
            height: 10px;
        }

        .signal span:nth-child(4) {
            height: 12px;
            background: rgba(255,255,255,0.38);
        }

        .login-panel {
            position: absolute;
            top: 28px;
            bottom: 0;
            left: 0;
            width: min(520px, 42vw);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 56px 58px;
            background: linear-gradient(180deg, rgba(1,3,7,0.86), rgba(1,3,7,0.78));
            border-right: 1px solid var(--line);
            backdrop-filter: blur(10px);
        }

        .logo {
            width: min(320px, 82%);
            max-height: 128px;
            object-fit: contain;
            margin-bottom: 26px;
            filter: drop-shadow(0 14px 26px rgba(0,0,0,0.32));
        }

        .mobile-title {
            display: none;
        }

        .subtitle {
            color: var(--muted);
            font-size: 17px;
            line-height: 1.4;
            text-align: center;
            margin-bottom: 28px;
        }

        .accent {
            width: 210px;
            height: 4px;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--red) 0 46%, var(--yellow) 46% 58%, var(--red) 58% 100%);
            margin-bottom: 34px;
        }

        .login-btn {
            width: min(300px, 100%);
            min-height: 52px;
            border: 0;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--red), #ef3c18 48%, var(--yellow));
            color: var(--white);
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            box-shadow: 0 14px 28px rgba(215,25,32,0.25);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 18px 36px rgba(215,25,32,0.34);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .footer-note {
            position: absolute;
            left: 48px;
            bottom: 30px;
            color: rgba(255,255,255,0.44);
            font-size: 11px;
        }

        .footer-note a {
            color: rgba(255,255,255,0.58);
            text-decoration: none;
        }

        .footer-note a:hover {
            color: rgba(255,255,255,0.86);
            text-decoration: underline;
        }

        @media (max-width: 900px) {
            .device {
                min-height: 100vh;
            }

            .login-panel {
                width: 48vw;
                padding: 34px 32px;
            }

            .logo {
                width: min(280px, 88%);
                margin-bottom: 22px;
            }

            .subtitle {
                font-size: 15px;
            }
        }

        @media (max-width: 720px) {
            body {
                overflow: auto;
            }

            body::before {
                display: block;
                background-image: url("assets/login-mobile-bg.jpg");
                background-size: cover;
                background-position: center top;
                transform: scale(1.01);
            }

            body::after {
                display: block;
                background:
                    linear-gradient(180deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.18) 38%, rgba(0,0,0,0.86) 100%),
                    linear-gradient(90deg, rgba(0,0,0,0.08), rgba(0,0,0,0.12));
            }

            .stage {
                min-height: 100svh;
                align-items: end;
                padding: 18px;
            }

            .device {
                width: 100%;
                max-height: none;
                aspect-ratio: auto;
                border: 0;
                border-radius: 0;
                padding: 0;
                background: transparent;
                box-shadow: none;
            }

            .screen {
                min-height: calc(100svh - 36px);
                overflow: visible;
                border: 0;
                border-radius: 0;
                background: transparent;
            }

            .status-bar {
                display: none;
            }

            .login-panel {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                top: auto;
                width: 100%;
                min-height: 318px;
                justify-content: flex-end;
                padding: 28px 24px 30px;
                border: 1px solid rgba(255,255,255,0.14);
                border-radius: 26px;
                background: linear-gradient(180deg, rgba(4,7,12,0.78), rgba(2,4,8,0.92));
                box-shadow: 0 -18px 54px rgba(0,0,0,0.32);
            }

            .logo {
                width: min(290px, 82vw);
                max-height: 92px;
                margin-bottom: 18px;
            }

            .mobile-title {
                display: block;
                font-size: clamp(34px, 10vw, 46px);
                line-height: 1;
                font-weight: 800;
                margin-bottom: 10px;
            }

            .subtitle {
                font-size: 15px;
                margin-bottom: 20px;
            }

            .accent {
                width: min(210px, 60vw);
                margin-bottom: 24px;
            }

            .login-btn {
                width: 100%;
                min-height: 54px;
                font-size: 16px;
            }

            .footer-note {
                display: none;
            }
        }
    </style>
</head>
<body>
    <main class="stage">
        <section class="device" aria-label="HISPAFLY EFB login">
            <div class="screen">
                <div class="status-bar" aria-hidden="true">
                    <span id="utcTime">--:-- UTC</span>
                    <span>HISPAFLY EFB</span>
                    <span class="status-right">
                        <span class="signal">
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                        </span>
                        <span>100%</span>
                    </span>
                </div>

                <div class="login-panel">
                    <img class="logo" alt="HISPAFLY" src="assets/hispafly-logo-white.png">
                    <h1 class="mobile-title">HISPAFLY</h1>
                    <p class="subtitle">Electronic Flight Bag</p>
                    <div class="accent" aria-hidden="true"></div>
                    <form id="loginForm" style="width:min(360px,88vw);display:grid;gap:10px;">
                        <input class="login-btn" id="email" type="email" autocomplete="username" placeholder="AOC email" required style="text-align:left;background:#fff;color:#10243e;">
                        <input class="login-btn" id="password" type="password" autocomplete="current-password" placeholder="Password" required style="text-align:left;background:#fff;color:#10243e;">
                        <button class="login-btn" id="loginBtn" type="submit">LOGIN WITH HISPAFLY AOC</button>
                        <p id="loginError" role="alert" style="display:none;color:#ffb4b4;margin:0;"></p>
                    </form>
                    <div class="footer-note">
                        Pilot access managed by HISPAFLY AOC ·
                        <a href="privacy-policy.html">Privacy</a> ·
                        <a href="intellectual-property.html">IP Notice</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        function updateUtcTime() {
            const now = new Date();
            const hours = String(now.getUTCHours()).padStart(2, "0");
            const minutes = String(now.getUTCMinutes()).padStart(2, "0");
            document.getElementById("utcTime").textContent = `${hours}:${minutes} UTC`;
        }

        updateUtcTime();
        setInterval(updateUtcTime, 30000);

        document.getElementById("loginForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            const button = document.getElementById("loginBtn");
            const error = document.getElementById("loginError");
            button.disabled = true;
            error.style.display = "none";
            try {
                const response = await fetch("/api/aoc-proxy?path=/api/auth/local/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: document.getElementById("email").value, password: document.getElementById("password").value }) });
                const data = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(data.error === "invalid_credentials" ? "Email or password is incorrect." : (data.message || "AOC login is unavailable."));
                window.location.href = "dashboard.html";
            } catch (reason) {
                error.textContent = reason.message;
                error.style.display = "block";
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
